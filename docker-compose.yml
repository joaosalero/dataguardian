services:
  db:
    image: postgres:15
    container_name: dataguardian_db
    restart: always
    environment:
      POSTGRES_USER: dataguardian
      POSTGRES_PASSWORD: dataguardian
      POSTGRES_DB: dataguardian
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

# Run: docker-compose up -d
# Stop: docker-compose down
