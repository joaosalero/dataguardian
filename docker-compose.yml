services:
  db:
    image: postgres:15
    container_name: dataguardian_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataguardian}
      POSTGRES_DB: ${POSTGRES_DB:-dataguardian}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dataguardian} -d $${POSTGRES_DB:-dataguardian}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-go:
    build:
      context: ./backend-go
    container_name: dataguardian_backend_go
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-DataGuardian}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://dataguardian:dataguardian@db:5432/dataguardian}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-dataguardian_session}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      STORAGE_DIR: ${STORAGE_DIR:-/data/uploads}
      GO_BACKEND_ADDR: ${GO_BACKEND_ADDR:-0.0.0.0:8000}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-dev}
    container_name: dataguardian_frontend
    depends_on:
      backend-go:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-dev}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  validation:
    image: dataguardian-backend-go
    depends_on:
      backend-go:
        condition: service_healthy
      frontend:
        condition: service_healthy
    command: >
      sh -c "curl -fsS http://backend-go:8000/health
      && curl -fsS http://frontend:3000/login >/dev/null
      && echo 'DataGuardian validation passed'"

  backend-go-test:
    image: golang:1.25
    profiles: ["test"]
    working_dir: /app/backend-go
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql://dataguardian:dataguardian@db:5432/dataguardian}
    volumes:
      - .:/app
      - go_module_cache:/go/pkg/mod
    command: go test ./...

volumes:
  postgres_data:
  backend_uploads:
  go_module_cache:

# Run: docker compose up
# Stop: docker compose down
