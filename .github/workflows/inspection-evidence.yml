name: Inspect synthetic fixtures
on:
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'security/inspection-evidence-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Exercise production analyzers on inert fixtures
        working-directory: backend-go
        run: go test -count=1 -v ./internal/analysis -run 'TestInspectionEvidence|TestPDFMetadataKeepsFirstNonemptySupportedValues'
      - name: Start isolated local stack
        run: docker compose up --wait --build db backend-go frontend
      - name: Capture actual file analysis panel
        run: |
          python -m venv "$RUNNER_TEMP/capture-venv"
          "$RUNNER_TEMP/capture-venv/bin/pip" install --disable-pip-version-check playwright==1.55.0 Pillow==11.3.0
          "$RUNNER_TEMP/capture-venv/bin/python" docs/evidence/capture_file_result.py "$RUNNER_TEMP/file-result.webp" --channel chrome
          sha256sum "$RUNNER_TEMP/file-result.webp"
          echo DG_IMAGE_BEGIN
          base64 -w 1024 "$RUNNER_TEMP/file-result.webp"
          echo DG_IMAGE_END
