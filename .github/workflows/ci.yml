name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataguardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENVIRONMENT: test
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dataguardian
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod

      - name: Run Go backend tests
        working-directory: backend-go
        run: |
          go mod tidy
          go test ./...

      - name: Setup Python test tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run architecture contract test
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/test_backend_mode_contract.py

  security-checks:
    name: Security checks
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run secret scan
        run: ./security/run_security_checks.sh --secrets-only

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
